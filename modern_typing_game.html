<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>TypeMaster Pro - Typing Speed Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Light Mode */
      --primary-bg: #ffffff;
      --secondary-bg: #f5f5f7;
      --accent-bg: #e8e8eb;
      --primary-text: #1d1d1f;
      --secondary-text: #555555;
      --accent-color: #0071e3;
      --error-color: #ff3b30;
      --success-color: #34c759;
      --border-radius: 16px;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.15);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --glass: rgba(255, 255, 255, 0.8);
      --glass-border: rgba(0, 0, 0, 0.1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        /* Dark Mode */
        --primary-bg: #0a0a0a;
        --secondary-bg: #1a1a1a;
        --accent-bg: #2a2a2a;
        --primary-text: #ffffff;
        --secondary-text: #cccccc;
        --accent-color: #00d9ff;
        --error-color: #ff4444;
        --success-color: #34c759;
        --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.5);
        --glass: rgba(20, 20, 20, 0.9);
        --glass-border: rgba(255, 255, 255, 0.1);
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: linear-gradient(135deg, var(--primary-bg) 0%, var(--secondary-bg) 100%);
      color: var(--primary-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 50%, var(--accent-color) 0%, transparent 50%),
                  radial-gradient(circle at 80% 80%, var(--accent-color) 0%, transparent 50%);
      opacity: 0.02;
      pointer-events: none;
      z-index: -1;
    }

    .container {
      width: 100%;
      max-width: 900px;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }

    .header {
      text-align: center;
      margin-bottom: 2.5rem;
      position: relative;
    }

    .title {
      font-size: 3.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent-color), var(--primary-text));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
      letter-spacing: -1px;
    }

    .subtitle {
      color: var(--secondary-text);
      font-size: 1.1rem;
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    .game-container {
      background: var(--glass);
      backdrop-filter: blur(30px);
      border-radius: var(--border-radius);
      padding: 3rem;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--glass-border);
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .game-container::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(from 0deg, transparent 0deg, var(--accent-color) 90deg, transparent 180deg);
      animation: subtle-rotate 20s linear infinite;
      opacity: 0.03;
      z-index: 0;
    }

    @keyframes subtle-rotate {
      to { transform: rotate(360deg); }
    }

    .game-container > * {
      position: relative;
      z-index: 1;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--glass-border);
    }

    .controls {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .control-group {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    .btn {
      padding: 0.85rem 1.75rem;
      border: none;
      border-radius: 10px;
      background: var(--accent-color);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      font-size: 0.95rem;
      position: relative;
      overflow: hidden;
      white-space: nowrap;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.2);
      transition: left 0.3s ease;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 113, 227, 0.3);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: var(--accent-bg);
      color: var(--primary-text);
      border: 1px solid var(--glass-border);
    }

    .btn-secondary:hover {
      background: var(--secondary-bg);
      box-shadow: var(--shadow);
    }

    .theme-toggle {
      display: flex;
      gap: 0.5rem;
      background: var(--accent-bg);
      padding: 0.4rem;
      border-radius: 8px;
      border: 1px solid var(--glass-border);
    }

    .theme-toggle button {
      padding: 0.5rem 1rem;
      border: none;
      background: transparent;
      color: var(--secondary-text);
      cursor: pointer;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      transition: var(--transition);
      position: relative;
    }

    .theme-toggle button.active {
      background: var(--primary-bg);
      color: var(--accent-color);
      box-shadow: 0 2px 8px var(--shadow);
    }

    .theme-toggle button:hover {
      color: var(--primary-text);
    }

    .word-display {
      font-size: 4rem;
      font-weight: 700;
      text-align: center;
      margin: 3rem 0 2.5rem 0;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--secondary-bg) 0%, var(--accent-bg) 100%);
      border-radius: 12px;
      padding: 2rem;
      border: 1px solid var(--glass-border);
    }

    .word-display.correct {
      color: var(--success-color);
      animation: pulse-success 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    .word-display.incorrect {
      color: var(--error-color);
      animation: shake 0.3s ease-out;
    }

    @keyframes pulse-success {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    .input-container {
      position: relative;
      margin-bottom: 2.5rem;
    }

    .input-field {
      width: 100%;
      padding: 1.2rem 1.8rem;
      font-size: 1.3rem;
      border: 2px solid var(--glass-border);
      border-radius: 12px;
      background: var(--accent-bg);
      color: var(--primary-text);
      outline: none;
      transition: var(--transition);
      text-align: center;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .input-field:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15);
      background: var(--secondary-bg);
    }

    .input-field::placeholder {
      color: var(--secondary-text);
      opacity: 0.6;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: var(--accent-bg);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 2.5rem;
      border: 1px solid var(--glass-border);
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-color), var(--success-color));
      width: 0%;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 4px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: linear-gradient(135deg, var(--secondary-bg) 0%, var(--accent-bg) 100%);
      padding: 1.8rem;
      border-radius: 12px;
      text-align: center;
      transition: var(--transition);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
    }

    .stat-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-color);
      box-shadow: 0 12px 30px rgba(0, 113, 227, 0.15);
    }

    .stat-value {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--accent-color);
      margin-bottom: 0.5rem;
    }

    .stat-label {
      color: var(--secondary-text);
      font-size: 0.9rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .combo-display {
      text-align: center;
      margin-bottom: 1.5rem;
      padding: 1rem;
      background: var(--accent-bg);
      border-radius: 10px;
      border: 1px solid var(--glass-border);
    }

    .combo-count {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent-color);
      letter-spacing: 0.5px;
    }

    .game-over {
      text-align: center;
      padding: 2.5rem;
      background: linear-gradient(135deg, var(--secondary-bg) 0%, var(--accent-bg) 100%);
      border-radius: 12px;
      margin-top: 2rem;
      border: 2px solid var(--accent-color);
      animation: slideIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .final-score {
      font-size: 2.8rem;
      font-weight: 800;
      color: var(--accent-color);
      margin-bottom: 1rem;
    }

    .game-over p {
      color: var(--secondary-text);
      margin: 0.8rem 0;
      font-size: 1rem;
      line-height: 1.6;
    }

    .sound-toggle {
      position: fixed;
      top: 2rem;
      right: 2rem;
      background: var(--accent-bg);
      border: 1px solid var(--glass-border);
      border-radius: 50%;
      width: 56px;
      height: 56px;
      color: var(--primary-text);
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      box-shadow: var(--shadow);
      z-index: 100;
    }

    .sound-toggle:hover {
      background: var(--accent-color);
      color: white;
      transform: scale(1.1);
      box-shadow: 0 8px 25px rgba(0, 113, 227, 0.3);
    }

    @media (max-width: 768px) {
      .container {
        padding: 1rem;
      }
      
      .title {
        font-size: 2.5rem;
      }
      
      .subtitle {
        font-size: 1rem;
      }
      
      .game-container {
        padding: 1.5rem;
      }

      .word-display {
        font-size: 2.5rem;
        padding: 1.5rem;
        min-height: 80px;
        margin: 2rem 0 1.5rem 0;
      }
      
      .controls {
        flex-direction: column;
        gap: 1rem;
      }

      .control-group {
        width: 100%;
        gap: 0.5rem;
      }

      .btn {
        flex: 1;
        padding: 0.75rem 1.5rem;
      }
      
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 1rem;
      }

      .stat-card {
        padding: 1.2rem;
      }

      .stat-value {
        font-size: 1.8rem;
      }

      .top-bar {
        flex-direction: column;
        gap: 1rem;
        align-items: stretch;
      }

      .theme-toggle {
        width: 100%;
        justify-content: space-around;
      }

      .sound-toggle {
        top: 1rem;
        right: 1rem;
        width: 48px;
        height: 48px;
        font-size: 1.2rem;
      }
    }
  </style>
</head>

  <button class="sound-toggle" id="soundToggle">🔊</button>
  
  <div class="container">
    <div class="header">
      <h1 class="title">TypeMaster Pro</h1>
      <p class="subtitle">Test your typing speed with precision | Made by CTIVO</p>

    <div class="game-container">

        <div class="theme-toggle">
          <button data-theme="light" title="Light Mode">☀️</button>
          <button data-theme="system" class="active" title="System Mode">🖥️</button>
          <button data-theme="dark" title="Dark Mode">🌙</button>
        </div>
      </div>

      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="combo-display">
        <div class="combo-count" id="comboCount">Combo: 0</div>
      </div>

      <div class="word-display" id="wordDisplay">Press Start to Begin</div>
      
      <div class="input-container">
        <input type="text" class="input-field" id="inputField" placeholder="Type the word above..." disabled>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="timeValue">0</div>
          <div class="stat-label">Time (s)</div>
        </div>
        <div class="stat-card">

        </div>
        <div class="stat-card">

        </div>
        <div class="stat-card">
          <div class="stat-value" id="scoreValue">0</div>
          <div class="stat-label">Score</div>
        </div>
      </div>
    </div>
  </div>

    'She captured stunning photographs of the city at night.',
    'The engineer developed a solution to a challenging technical problem.',
    'During the storm, the captain navigated the ship through rough seas.',
    'The scientist\'s discovery had significant implications for medicine.',
    'He carefully studied the intricate designs of the cathedral.',
    'The playwright wrote dialogues that reflected complex human emotions.',
    'She juggled multiple responsibilities with remarkable efficiency.',
    'The expedition uncovered fossils that revealed prehistoric life.',
    'Advanced mathematics is essential for solving real-world problems.',
    'He recited poetry with passion and precision.',
    'The documentary provided insight into the lives of remote communities.',
    'Negotiating international treaties requires skill, patience, and tact.',
    'The chef experimented with flavors to create a unique dish.',
    'She meticulously planned every detail of the elaborate event.'],
            timeLimit: 30,
            multiplier: 2
          }
        };

        this.currentLevel = 'easy';
        this.currentMode = 'words';
        this.isPlaying = false;
        this.startTime = 0;
        this.currentText = '';
        this.wordsTyped = 0;
        this.correctWords = 0;
        this.totalKeystrokes = 0;
        this.correctKeystrokes = 0;
        this.combo = 0;
        this.maxCombo = 0;
        this.score = 0;
        this.timeLimit = 60;
        this.soundEnabled = true;
        this.currentTheme = 'system';

        this.initializeElements();
        this.bindEvents();
        this.initializeAudio();
        this.initializeTheme();
      }

      initializeElements() {
        this.wordDisplay = document.getElementById('wordDisplay');
        this.inputField = document.getElementById('inputField');
        this.startBtn = document.getElementById('startBtn');
        this.levelBtn = document.getElementById('levelBtn');
        this.modeBtn = document.getElementById('modeBtn');
        this.timeValue = document.getElementById('timeValue');
        this.wpmValue = document.getElementById('wpmValue');
        this.accuracyValue = document.getElementById('accuracyValue');
        this.scoreValue = document.getElementById('scoreValue');
        this.comboCount = document.getElementById('comboCount');
        this.progressFill = document.getElementById('progressFill');
        this.soundToggle = document.getElementById('soundToggle');
      }

      initializeAudio() {
        try {
          this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {
          console.log('Audio not supported');
        }
      }

      initializeTheme() {
        this.currentTheme = 'system';
        this.applyTheme('system');
      }

      applyTheme(theme) {
        const html = document.documentElement;
        
        if (theme === 'light') {
          html.style.colorScheme = 'light';
        } else if (theme === 'dark') {
          html.style.colorScheme = 'dark';
        } else {
          html.style.colorScheme = 'light dark';
        }
        
        this.currentTheme = theme;
      }

      playSound(frequency, duration = 100) {
        if (!this.soundEnabled || !this.audioContext) return;
        
        const oscillator = this.audioContext.createOscillator();
        const gainNode = this.audioContext.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(this.audioContext.destination);
        
        oscillator.frequency.value = frequency;
        gainNode.gain.setValueAtTime(0.1, this.audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + duration / 1000);
        
        oscillator.start();
        oscillator.stop(this.audioContext.currentTime + duration / 1000);
      }

      bindEvents() {
        this.startBtn.addEventListener('click', () => this.toggleGame());
        this.levelBtn.addEventListener('click', () => this.cycleLevel());
        this.modeBtn.addEventListener('click', () => this.cycleMode());
        this.inputField.addEventListener('input', (e) => this.handleInput(e));
        this.inputField.addEventListener('keydown', (e) => this.handleKeydown(e));
        this.soundToggle.addEventListener('click', () => this.toggleSound());

        // Theme switching
        document.querySelectorAll('.theme-toggle button').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const theme = e.target.dataset.theme;
            this.applyTheme(theme);
            document.querySelectorAll('.theme-toggle button').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
          });
        });

        // Prevent space from triggering buttons
        document.addEventListener('keydown', (e) => {
          if (e.code === 'Space' && this.isPlaying) {
            e.preventDefault();
          }
        });
      }

      toggleSound() {
        this.soundEnabled = !this.soundEnabled;
        this.soundToggle.textContent = this.soundEnabled ? '🔊' : '🔇';
      }

      cycleLevel() {
        const levels = Object.keys(this.levels);
        const currentIndex = levels.indexOf(this.currentLevel);
        this.currentLevel = levels[(currentIndex + 1) % levels.length];
        this.levelBtn.textContent = this.currentLevel.charAt(0).toUpperCase() + this.currentLevel.slice(1);
        this.timeLimit = this.levels[this.currentLevel].timeLimit;
      }

      cycleMode() {
        this.currentMode = this.currentMode === 'words' ? 'sentences' : 'words';
        this.modeBtn.textContent = this.currentMode.charAt(0).toUpperCase() + this.currentMode.slice(1);
      }

      toggleGame() {
        if (!this.isPlaying) {
          this.startGame();
        } else {
          this.endGame();
        }
      }

      startGame() {
        this.isPlaying = true;
        this.startTime = Date.now();
        this.wordsTyped = 0;
        this.correctWords = 0;
        this.totalKeystrokes = 0;
        this.correctKeystrokes = 0;
        this.combo = 0;
        this.maxCombo = 0;
        this.score = 0;
        this.timeLimit = this.levels[this.currentLevel].timeLimit;

        this.inputField.disabled = false;
        this.inputField.focus();
        this.startBtn.textContent = 'Stop Game';
        this.startBtn.classList.add('btn-secondary');

        this.generateNewText();
        this.gameTimer = setInterval(() => this.updateTimer(), 100);
        this.playSound(440, 150);
      }

      endGame() {
        this.isPlaying = false;
        clearInterval(this.gameTimer);
        
        this.inputField.disabled = true;
        this.startBtn.textContent = 'Start Game';
        this.startBtn.classList.remove('btn-secondary');
        
        this.showGameOver();
        this.playSound(330, 300);
      }

      generateNewText() {
        const textArray = this.levels[this.currentLevel][this.currentMode];
        this.currentText = textArray[Math.floor(Math.random() * textArray.length)];
        this.wordDisplay.textContent = this.currentText;
        this.wordDisplay.classList.remove('correct', 'incorrect');
      }

      handleKeydown(e) {
        if (!this.isPlaying) return;
        
        if (this.audioContext && this.audioContext.state === 'suspended') {
          this.audioContext.resume();
        }
      }

      handleInput(e) {
        if (!this.isPlaying) return;

        const typed = e.target.value;
        this.totalKeystrokes++;

        if (typed === this.currentText) {
          this.handleCorrectInput();
          e.target.value = '';
        } else if (this.currentText.startsWith(typed)) {
          this.handlePartialCorrect();
        } else {
          this.handleIncorrectInput();
        }

        this.updateStats();
      }

      handleCorrectInput() {
        this.correctWords++;
        this.correctKeystrokes += this.currentText.length;
        this.combo++;
        this.maxCombo = Math.max(this.maxCombo, this.combo);
        
        const basePoints = this.currentText.length * this.levels[this.currentLevel].multiplier;
        const comboBonus = Math.floor(this.combo / 5) * basePoints * 0.5;
        this.score += basePoints + comboBonus;

        this.wordDisplay.classList.add('correct');
        this.playSound(523, 100);
        
        this.generateNewText();
        setTimeout(() => {
          this.wordDisplay.classList.remove('correct');
        }, 300);
      }

      handlePartialCorrect() {
        this.correctKeystrokes++;
        this.wordDisplay.classList.remove('incorrect');
      }

      handleIncorrectInput() {
        this.combo = 0;
        this.wordDisplay.classList.add('incorrect');
        this.playSound(200, 150);
        
        setTimeout(() => {
          this.wordDisplay.classList.remove('incorrect');
        }, 300);
      }

      updateTimer() {
        const elapsed = (Date.now() - this.startTime) / 1000;
        const remaining = Math.max(0, this.timeLimit - elapsed);
        
        this.timeValue.textContent = Math.ceil(remaining);
        
        const progress = ((this.timeLimit - remaining) / this.timeLimit) * 100;
        this.progressFill.style.width = `${progress}%`;
        
        if (remaining <= 0) {
          this.endGame();
        }
      }

      updateStats() {
        const elapsed = (Date.now() - this.startTime) / 1000;
        
        const wpm = elapsed > 0 ? Math.round((this.correctWords * 60) / elapsed) : 0;
        this.wpmValue.textContent = wpm;

        const accuracy = this.totalKeystrokes > 0 ? 
          Math.round((this.correctKeystrokes / this.totalKeystrokes) * 100) : 100;
        this.accuracyValue.textContent = `${accuracy}%`;

        this.comboCount.textContent = `Combo: ${this.combo}`;
        
        this.scoreValue.textContent = Math.round(this.score);
      }

      showGameOver() {
        const elapsed = this.timeLimit;
        const wpm = Math.round((this.correctWords * 60) / elapsed);
        const accuracy = this.totalKeystrokes > 0 ? 
          Math.round((this.correctKeystrokes / this.totalKeystrokes) * 100) : 100;

        const gameOverDiv = document.createElement('div');
        gameOverDiv.className = 'game-over';
        gameOverDiv.innerHTML = `
          <div class="final-score">${Math.round(this.score)} Points</div>
          <p>Final Results:</p>
          <p>WPM: ${wpm} | Accuracy: ${accuracy}% | Max Combo: ${this.maxCombo}</p>
          <p>Words Completed: ${this.correctWords}</p>
          <button class="btn" onclick="this.parentElement.remove()">Close</button>
        `;

        document.querySelector('.game-container').appendChild(gameOverDiv);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      new TypingGame();
    });
  </script>
</body>
</html>
